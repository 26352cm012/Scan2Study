<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ask Scan2Study</title><script src="config.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#101522;color:#edf1fb;font:15px/1.5 system-ui;height:100dvh}button,input{font:inherit}button{cursor:pointer}.layout{height:100dvh;display:grid;grid-template-columns:260px 1fr}.side{background:#0b0f18;border-right:1px solid #252c3a;padding:16px;display:flex;flex-direction:column;gap:12px}.brand{font-weight:850;font-size:17px;margin:3px 0 12px}.logo{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:11px;background:#6b78f7;margin-right:8px}.new{background:#1a2130;color:#f4f6ff;border:1px solid #30394b;border-radius:12px;padding:11px;text-align:left;font-weight:750}.recent{font-size:11px;color:#8f9bb4;font-weight:850;letter-spacing:1px;margin:15px 5px 0}.history{overflow:auto;display:flex;flex-direction:column;gap:5px}.history button{border:0;background:transparent;color:#cbd4e7;text-align:left;padding:10px;border-radius:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.history button.active,.history button:hover{background:#252e40}.side-bottom{margin-top:auto;color:#75819a;font-size:11px}.main{display:flex;flex-direction:column;min-width:0}.top{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid #252c3a}.top a{color:#aab6ff;text-decoration:none;font-size:13px}.mobile-menu{display:none;background:transparent;color:#dce3f8;border:0}.messages{flex:1;overflow:auto;padding:25px 20px}.thread{width:min(760px,100%);margin:0 auto;display:flex;flex-direction:column;gap:24px}.welcome{text-align:center;margin:auto;padding:35px 12px}.welcome h1{font-size:clamp(27px,4vw,38px);letter-spacing:-1px;margin:0 0 10px}.welcome p{color:#a7b2cc;margin:0}.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:22px}.chips button{background:#1b2332;border:1px solid #354057;color:#cbd4f3;border-radius:999px;padding:8px 12px;font-size:12px}.msg{display:flex;gap:12px;align-items:flex-start}.avatar{width:30px;height:30px;flex:0 0 30px;border-radius:10px;background:#27324a;display:grid;place-items:center}.msg.user .avatar{background:#3b4773}.bubble{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.75;padding:2px 0;flex:1}.composer-wrap{padding:12px 20px 20px}.composer{width:min(760px,100%);margin:auto;background:#1b2332;border:1px solid #354057;border-radius:18px;padding:10px;display:flex;gap:10px;align-items:flex-end}.composer input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#f4f6ff;padding:10px;font-size:15px}.composer input::placeholder{color:#8794ad}.send{border:0;background:#7885ff;color:#fff;border-radius:12px;width:42px;height:42px;font-weight:900}.disclaimer{text-align:center;color:#74819a;font-size:11px;margin:10px auto 0}@media(max-width:700px){.layout{grid-template-columns:1fr}.side{display:none}.top{padding:0 15px}.mobile-menu{display:inline-block;font-size:19px}.messages{padding:20px 14px}.composer-wrap{padding:10px 12px 14px}.welcome{padding:25px 5px}.layout.sidebar-open .side{display:flex;position:absolute;z-index:4;top:0;bottom:0;width:245px}.layout.sidebar-open .main{visibility:hidden}}
</style></head><body><div class="layout" id="layout"><aside class="side"><div class="brand"><span class="logo">✦</span>Scan2Study</div><button class="new" id="newChat">＋ New chat</button><div class="recent">RECENT CHATS</div><div class="history" id="history"></div><div class="side-bottom">Chats saved on this device.</div></aside><section class="main"><div class="top"><div><button class="mobile-menu" id="menu">☰</button> <strong>Ask Scan2Study</strong></div><a href="index.html">← Home</a></div><div class="messages" id="messages"><div class="thread" id="thread"></div></div><div class="composer-wrap"><form class="composer" id="form"><input id="input" autocomplete="off" maxlength="3000" placeholder="Message Scan2Study…" required aria-label="Message Scan2Study"><button class="send" id="send" aria-label="Send">↑</button></form><div class="disclaimer">AI can make mistakes. Check important school facts with your textbook.</div></div></section></div>
<script>
const API=(window.SCAN2STUDY_CONFIG?.apiBaseUrl||'').replace(/\/+$/,'');const STORE='scan2study_chats_v1';let chats=[],current=null,busy=false;const thread=document.getElementById('thread'),historyEl=document.getElementById('history'),input=document.getElementById('input'),send=document.getElementById('send'),messages=document.getElementById('messages'),layout=document.getElementById('layout');
function save(){try{localStorage.setItem(STORE,JSON.stringify(chats))}catch(e){}}function load(){try{chats=JSON.parse(localStorage.getItem(STORE)||'[]')}catch(e){chats=[]}if(!Array.isArray(chats))chats=[];chats=chats.filter(x=>x&&Array.isArray(x.messages))}
function titleFor(s){return(s||'New chat').trim().slice(0,42)}
function renderHistory(){historyEl.innerHTML='';chats.slice().reverse().forEach(c=>{let b=document.createElement('button');b.textContent=c.title||'New chat';b.className=c.id===current?'active':'';b.onclick=()=>openChat(c.id);historyEl.appendChild(b)})}
function bubble(role,text){let row=document.createElement('div');row.className='msg '+role;let av=document.createElement('div');av.className='avatar';av.textContent=role==='user'?'🙂':'✦';let body=document.createElement('div');body.className='bubble';body.textContent=text;row.append(av,body);thread.appendChild(row);messages.scrollTop=messages.scrollHeight;return body}
function welcome(){thread.innerHTML='<div class="welcome"><h1>What can I help you understand?</h1><p>Ask a question, learn a topic, or study step by step.</p><div class="chips"><button data-q="Explain photosynthesis in simple words.">Explain simply</button><button data-q="Give me a quick summary of the water cycle.">Quick summary</button><button data-q="Quiz me on fractions.">Quiz me</button></div></div>'}
function renderChat(){thread.innerHTML='';let c=chats.find(x=>x.id===current);if(!c||!c.messages.length){welcome();return}c.messages.forEach(m=>bubble(m.role==='user'?'user':'assistant',m.content))}
function newChat(){current=null;renderChat();renderHistory();input.focus()}function openChat(id){current=id;renderChat();renderHistory();layout.classList.remove('sidebar-open')}
async function ask(text){text=(text||'').trim();if(!text||busy)return;let c=chats.find(x=>x.id===current);if(!c){c={id:Date.now().toString(),title:titleFor(text),messages:[]};chats.push(c);current=c.id}c.messages.push({role:'user',content:text});if(c.messages.length===1)c.title=titleFor(text);save();renderChat();renderHistory();input.value='';busy=true;send.disabled=true;let pending=bubble('assistant','Thinking…');try{let res=await fetch(API+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({messages:c.messages.slice(-10)})});let data=await res.json().catch(()=>({}));if(!res.ok)throw Error(data.error||'AI service unavailable');if(!data.answer)throw Error('No answer returned.');pending.textContent=data.answer;c.messages.push({role:'assistant',content:data.answer});save()}catch(e){pending.textContent=(e.message||'Could not connect.')+' Check backend status.'}finally{busy=false;send.disabled=false;input.focus();messages.scrollTop=messages.scrollHeight}}
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();ask(input.value)});document.getElementById('newChat').onclick=newChat;document.getElementById('menu').onclick=()=>layout.classList.toggle('sidebar-open');document.addEventListener('click',e=>{let b=e.target.closest('[data-q]');if(b)ask(b.dataset.q)});load();if(chats.length)openChat(chats[chats.length-1].id);else newChat();
</script></body></html>
