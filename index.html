<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan2Study</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f7fb;
            color: #222;
        }

        header {
            background: #315efb;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        header p {
            margin-bottom: 0;
        }

        .container {
            max-width: 600px;
            margin: 25px auto;
            padding: 20px;
        }

        .upload-box {
            background: white;
            padding: 30px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 4px 15px #00000018;
        }

        .upload-box h2 {
            margin-top: 0;
        }

        input[type="file"] {
            margin: 20px 0;
        }

        button {
            background: #315efb;
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        .features {
            display: grid;
            gap: 12px;
            margin-top: 25px;
        }

        .feature {
            background: white;
            padding: 18px;
            border-radius: 14px;
            box-shadow: 0 3px 10px #00000012;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: #eef2ff;
            display: none;
        }
    </style>
</head>

<body>

<header>
    <h1>📚 Scan2Study</h1>
    <p>Learn smarter from your study material</p>
</header>

<div class="container">

    <div class="upload-box">
        <h2>📸 Scan Your Study Material</h2>

        <p>Upload a photo of your notes, textbook or worksheet.</p>
